name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Format, lint and typecheck
    # Pinned: srt/bubblewrap fails on ubuntu-26.04, see #23
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      # ESLint enforces the import boundaries between layers (eslint/import-boundaries.js).
      - run: npm run lint
      - run: npm run typecheck

  architecture:
    name: Architecture tests
    # Pinned: srt/bubblewrap fails on ubuntu-26.04, see #23
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:architecture

  test:
    name: Tests (Node ${{ matrix.node }})
    # Pinned: srt/bubblewrap fails on ubuntu-26.04, see #23
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [22.12, 22, 24]
    env:
      # test/srt.integration.test.ts fails instead of skipping when srt cannot run: the srt sandbox is checked on Linux.
      PROCTOR_REQUIRE_SRT: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Host tools srt needs on Linux; Ubuntu 24.04 restricts the unprivileged user namespaces bubblewrap relies on.
      - name: Install the srt host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap socat ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --unshare-all --ro-bind / / --dev /dev --proc /proc true
      - run: npm ci
      - run: npm run test:unit
      - run: npm run test:behavior

  package:
    name: Package smoke test
    # Pinned: srt/bubblewrap fails on ubuntu-26.04, see #23
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm pack
      # Installs the tarball in a fresh project, typechecks an eval file against the published types and runs it.
      - run: scripts/smoke-pack.sh "$PWD"/fluce-proctor-*.tgz
