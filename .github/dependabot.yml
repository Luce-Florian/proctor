version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/node follows the oldest supported Node (engines: >= 22.12).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A TypeScript major waits until typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: build
      prefix-development: chore
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
